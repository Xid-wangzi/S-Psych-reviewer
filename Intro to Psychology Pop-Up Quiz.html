<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intro to Psychology Pop-Up Quiz</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef1f8;--card:#fff;--ink:#1c2340;--mute:#5d6688;--line:#d5daea;--acc:#3b3fa8;--ok:#14785a;--okbg:#e0f4ec;--bad:#b3261e;--badbg:#fbe6e4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12152a;--card:#1b2040;--ink:#e8ebfa;--mute:#9aa3c7;--line:#333a63;--acc:#8b90ff;--ok:#5fd3ab;--okbg:#153a31;--bad:#ff8a80;--badbg:#42201f}}
:root[data-theme="dark"]{--bg:#12152a;--card:#1b2040;--ink:#e8ebfa;--mute:#9aa3c7;--line:#333a63;--acc:#8b90ff;--ok:#5fd3ab;--okbg:#153a31;--bad:#ff8a80;--badbg:#42201f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
.home{max-width:560px;margin:0 auto;padding:12vh 20px;text-align:center}
h1{font:700 2rem/1.15 Georgia,"Times New Roman",serif;margin:0 0 12px}
.home p{color:var(--mute);margin:0 0 28px}
button{font:inherit;cursor:pointer}
.go{background:var(--acc);color:var(--bg);border:0;border-radius:999px;padding:14px 34px;font-weight:600}
.go:focus-visible,.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.62);display:none;align-items:center;justify-content:center;padding:14px}
.ov.on{display:flex}
.pop{background:var(--card);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:18px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.pop{animation:none}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center;font-size:.78rem;color:var(--mute)}
.stat b{display:block;font-size:1.15rem;color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.qn{color:var(--mute);font-size:.85rem;margin-bottom:6px}
.q{font:600 1.1rem/1.5 Georgia,serif;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt b{color:var(--acc);min-width:1.2em}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:14px;border-radius:12px;background:var(--bg);display:none}
.fb.on{display:block}
.fb h3{margin:0 0 6px;font-size:1rem}
.fb p{margin:0 0 12px;color:var(--mute)}
.end{text-align:center}
.big{font:700 3rem Georgia,serif;color:var(--acc);margin:6px 0}
</style></head><body>
<main class="home">
<h1>Intro to Psychology: Situational Quiz</h1>
<p>Scenario-based questions drawn only from your reviewer. One question at a time, with instant feedback.</p>
<button class="go" id="start">Start quiz</button>
</main>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="Quiz"><div class="pop" id="pop"></div></div>
<script>
// Format: [scenario, [A,B,C,D], correctIndex(0-3), explanation]. Append more questions to keep going.
const Q=[
["A school psychologist spends two weeks in a Grade 5 classroom. She notes and documents every time a student leaves their seat, but does not yet draw any conclusion about why it happens. Which objective is she fulfilling?",["Understand or explain behavior","Predict behavior","Describe behavior","Control or influence behavior"],2,"Observing, recording, and documenting without concluding the reason is the Describe objective."],
["Mia's uncle says, \"Psychologists prescribe pills for depression; that's their whole job.\" Which correction fits the material?",["Psychology centers on counseling and therapy; prescribing is psychiatry's role.","Psychologists prescribe only anti-anxiety drugs; psychiatrists prescribe the rest.","Both prescribe equally; psychiatrists simply study longer.","Psychologists only run experiments and never provide counseling."],0,"The material states psychiatry is about medication and prescription, while psychology is about counseling and therapy."],
["Leo tells his teacher he finished his homework, but he did not. Nobody can directly see the lie. Based on visibility, how is this behavior classified?",["Overt behavior","Covert behavior","Involuntary behavior","Non-conscious behavior"],1,"Covert behavior is not directly visible (e.g., lying, thinking). Overt behavior is outwardly observable."],
["While Ben sleeps, his body digests dinner. Instruments could detect this activity, but he has no awareness or control of it. What is it?",["Conscious behavior","Unconscious behavior","Non-conscious behavior","Voluntary behavior"],2,"Non-conscious behavior covers automatic body processes without awareness or control that instruments can detect."],
["Rina feels uncomfortable around a new coworker and cannot explain why. Her body reacts because of a past traumatic event. Which awareness-based type is this?",["Conscious behavior","Non-conscious behavior","Voluntary behavior","Unconscious behavior"],3,"Unconscious behavior is done without awareness of the reason, often tied to past or traumatic events."],
["Sam is angry at his friend. Instead of shouting, he waits and talks calmly later. How is this behavior classified?",["Irrational","Rational","Involuntary","Complex"],1,"Rational behavior is based on logic, facts, and careful thinking, within the realm of sanity and adequate reason."],
["Marco knows heavy drinking harms his health, yet he drinks whenever he feels stressed and emotional. Which type of behavior is this?",["Irrational","Rational","Non-conscious","Simple"],0,"Irrational behavior is driven by emotions and impulses rather than sound reasoning, even when the harm is known."],
["Pedro flinches at a sudden bang, then picks up his pen to write notes. Which action is involuntary, and why?",["Writing, because it needs concentration","Both, because each involves the body","Neither, because both are visible","Flinching, because it is automatic and not consciously controlled"],3,"Involuntary actions are automatic (sneezing, flinching); voluntary actions like writing are intentional and under control."],
["A chef opens the stove, slices ingredients, sautes garlic, and fries food while singing and dancing. Later a student picks up a pen. How are these classified?",["Both simple","Chef simple, student complex","Both complex","Chef complex, student simple"],3,"Complex behavior involves many mental and physical processes (multitasking); simple behavior is a single easy action like picking a pen."],
["A researcher designs an experiment to test whether sleep affects memory, gathering evidence through observation. Which element of psychology is most clearly shown?",["Scientific study","Behavior","Mental processes","Study of the soul"],0,"Science/scientific study involves research, evidence, observation, and experiments, such as testing if sleep affects memory."],
["Dan silently imagines several vacation spots and decides which one to book. Nothing has been done yet. Which element of psychology does this show?",["Behavior","Scientific study","Mental processes","Empirical observation"],2,"Mental processes are activities inside the mind: thinking, remembering, imagining, learning, deciding."],
["A student reads a psychology textbook written before the early 1900s. How would it most likely define psychology?",["The scientific study of behavior and mental processes","The study of the mind or soul","The study of behavior only","The study of group history"],1,"Psychology was defined as the study of the mind or soul until the early 1900s; the modern definition came later."],
["After noticing that class absences rose, a psychologist examines family life, culture, and school conditions to find out why. Which objective is this?",["Describe behavior","Understand or explain behavior","Predict behavior","Control or influence behavior"],1,"Investigating causes and contributing factors to learn why behavior happens is the Understand objective."],
["Using research and evidence, a psychologist anticipates which students may struggle next term and prepares support in advance. Which objective is this?",["Describe behavior","Understand or explain behavior","Control or influence behavior","Predict behavior"],3,"Prediction anticipates future behavior based on research and evidence, not guessing, so interventions can be prepared."],
["A therapist uses psychological techniques to help a client develop healthier thoughts, emotions, and behaviors. Which objective is this?",["Describe behavior","Predict behavior","Control or influence behavior","Understand or explain behavior"],2,"Control or influence alters behavior, traits, ideas, or beliefs to improve well-being and solve problems."],
["A clinic team works through the scientific process psychologists use. Which order of questions matches the material?",["What happened? Why did it happen? What will happen next? How can we change it?","Why did it happen? What happened? How can we change it? What will happen next?","What happened? What will happen next? Why did it happen? How can we change it?","How can we change it? What happened? Why did it happen? What will happen next?"],0,"The sequence is Describe (what happened), Understand (why), Predict (what next), Control (how to improve or change)."],
["A researcher traces a teen's anxiety to family conflict, peer pressure, and school culture. Which category of factors is being used?",["Biological factors","Psychological factors","Social and environmental factors","Genetic factors"],2,"Social and environmental factors include family, friends, culture, and school; biological factors are genes, hormones, and the brain."],
["After a stroke, a person becomes forgetful. A specialist studies which brain area was damaged and how it affects memory. Which field is this?",["Biopsychology","Psychiatry","Social psychology","Psychotherapy"],0,"Biopsychology applies biology to study how the brain, nervous system, hormones, and genes influence behavior and mental processes."],
["A lab manipulates a specific brain region in rats under controlled conditions to see how perception and behavior change. Which field fits best?",["Biopsychology","Physiological psychology","Psychosurgery","Psychiatry"],1,"Physiological psychology studies neural mechanisms of perception and behavior through direct manipulation of the brain of non-human animal subjects."],
["A patient with severe depression needs a medical doctor who can prescribe antidepressants and monitor progress. Which field applies?",["Psychotherapy","Social psychology","Biopsychology","Psychiatry"],3,"Psychiatry is the branch of medicine where medical doctors can prescribe medication to treat mental disorders."],
["A college student with anxiety attends weekly sessions to learn coping strategies through counseling. Which field applies?",["Psychiatry","Psychotropics","Psychosurgery","Psychotherapy"],3,"Psychotherapy treats emotional, behavioral, or psychological problems through counseling or talk therapy."],
["A person with schizophrenia who hears voices is given an antipsychotic to reduce symptoms. What category is this medication?",["Psychotropics","Psychotherapy","Psychosurgery","Biopsychology"],0,"Psychotropics are medications that affect mood, thoughts, and perception, including antipsychotic agents."],
["When other treatments have failed, a person with severe mental illness has specific brain areas surgically altered. What is this called?",["Psychotropics","Psychosurgery","Psychotherapy","Physiological psychology"],1,"Psychosurgery involves surgical alteration of the brain for severe disorders when other treatments failed; it is very rare today."],
["A student studies harder because friends encourage her to do well in school. Which field studies how other people influence thoughts, feelings, and behavior?",["Biopsychology","Psychotherapy","Social psychology","Physiological psychology"],2,"Social psychology studies how other people influence our thoughts, feelings, and behavior."]
];
const $=id=>document.getElementById(id),L="ABCD";
let i=0,ok=0,bad=0,done=false;
function stats(){return `<div class="stats"><div class="stat"><b>${i+1}/${Q.length}</b>Question</div><div class="stat"><b>${ok}</b>Correct</div><div class="stat"><b>${bad}</b>Incorrect</div><div class="stat"><b>${ok}/${ok+bad}</b>Score</div></div><div class="bar"><i style="width:${(ok+bad)/Q.length*100}%"></i></div>`}
function show(){
  const q=Q[i];done=false;
  $("pop").innerHTML=stats()+`<div class="qn">Remaining after this: ${Q.length-i-1}</div><p class="q">${q[0]}</p>`+
   q[1].map((t,k)=>`<button class="opt" data-k="${k}"><b>${L[k]}.</b><span>${t}</span></button>`).join("")+
   `<div class="fb" id="fb"></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}
function pick(k){
  if(done)return;done=true;const q=Q[i],right=k===q[2];
  right?ok++:bad++;
  document.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true;if(n===q[2])b.classList.add("ok");else if(n===k)b.classList.add("bad")});
  const last=i===Q.length-1;
  $("fb").innerHTML=`<h3 style="color:var(--${right?"ok":"bad"})">${right?"Correct":"Incorrect"}. The answer is ${L[q[2]]}.</h3><p>${q[3]}</p><button class="go" id="nx">${last?"See results":"Next question"}</button>`;
  $("fb").classList.add("on");$("nx").focus();
  $("nx").onclick=()=>{if(last)finish();else{i++;show()}};
  document.querySelector(".stats").outerHTML=stats().split('<div class="bar">')[0];
  document.querySelector(".bar i").style.width=(ok+bad)/Q.length*100+"%";
}
function finish(){
  const p=Math.round(ok/Q.length*100);
  const msg=p>=90?"Excellent. You apply the concepts with confidence.":p>=75?"Strong. Review the items you missed to close the gaps.":p>=50?"Fair. Revisit the distinctions between closely related concepts.":"Keep studying. Reread the reviewer, then retry.";
  $("pop").innerHTML=`<div class="end"><h1>Quiz complete</h1><div class="big">${ok}/${Q.length}</div><p>${p}% correct, ${bad} incorrect.</p><p>${msg}</p><button class="go" id="again">Try again</button></div>`;
  $("again").onclick=()=>{i=ok=bad=0;show()};
}
$("start").onclick=()=>{i=ok=bad=0;$("ov").classList.add("on");show()};
document.addEventListener("keydown",e=>{const k=L.indexOf(e.key.toUpperCase());if(k>-1&&$("ov").classList.contains("on")&&document.querySelector(".opt"))pick(k)});
</script></body></html>
